<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI SaaS Factory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col antialiased selection:bg-emerald-500 selection:text-black">

  <!-- Top Navigation Bar -->
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50 px-6 py-3.5 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-bold text-base shadow-sm">
        ⚡
      </div>
      <div>
        <h1 class="font-bold text-sm tracking-wide text-white flex items-center gap-2">
          AI SaaS Factory <span class="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-1.5 py-0.5 rounded font-mono font-normal">v3.5 Engine</span>
        </h1>
        <p class="text-[11px] text-slate-400 font-mono">Air-Gapped Multi-Agent Software Assembly Line</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <button onclick="resetPipeline()" class="text-xs bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 px-3 py-1.5 rounded-lg transition font-medium flex items-center gap-1.5 shadow-sm">
        <i class="fa-solid fa-rotate-left"></i> Reset Pipeline
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 p-6 max-w-7xl w-full mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- Left Column: Input & Blueprints -->
    <div class="lg:col-span-6 flex flex-col gap-6">

      <!-- Navigation Tabs -->
      <div class="flex border-b border-slate-800 gap-2">
        <button onclick="switchTab('custom')" id="tab-custom" class="px-4 py-2 text-xs font-semibold border-b-2 border-emerald-500 text-emerald-400 transition flex items-center gap-2">
          <i class="fa-solid fa-code"></i> Custom Build
        </button>
        <button onclick="switchTab('market')" id="tab-market" class="px-4 py-2 text-xs font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition flex items-center gap-2">
          <i class="fa-solid fa-chart-line"></i> Market Scan
        </button>
      </div>

      <!-- Tab Content: Custom Build -->
      <div id="view-custom" class="flex flex-col gap-4">
        <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-4 shadow-lg">
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Project Title</label>
          <input type="text" id="customTitle" class="w-full bg-slate-950 border border-slate-700/80 rounded-lg px-3 py-2 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 mb-3" placeholder="e.g. ArbiPulse Pro – Multi-Sport Arbitrage Terminal">

          <label class="block text-xs font-medium text-slate-300 mb-1.5">Project Blueprint / Requirements</label>
          <textarea id="customPrompt" rows="8" class="w-full bg-slate-950 border border-slate-700/80 rounded-lg p-3 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 font-mono transition" placeholder="Describe the application, data models, calculations, sports markets, and UI components..."></textarea>

          <button onclick="submitCustomBuild()" id="submitBtn" class="mt-3 w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold py-2.5 rounded-lg transition flex items-center justify-center gap-2 shadow-sm">
            <i class="fa-solid fa-paper-plane"></i> Render 3 UI Wireframes
          </button>
        </div>
      </div>

      <!-- Tab Content: Market Scan -->
      <div id="view-market" class="hidden flex flex-col gap-4">
        <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-4 shadow-lg flex gap-2">
          <input type="text" id="scanFocusInput" class="flex-1 bg-slate-950 border border-slate-700/80 rounded-lg px-3 py-2 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500" placeholder="Focus niche (e.g. Sports betting, CleanTech, Logistics)...">
          <button onclick="scanMarket()" id="scanBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2 rounded-lg transition">
            Scan Market
          </button>
        </div>
        <div id="ideasList" class="grid grid-cols-1 gap-3"></div>
      </div>

      <!-- Visual Blueprint Picker (Step 2) -->
      <div id="uiPickerCard" class="hidden bg-slate-900/60 border border-slate-800 rounded-xl p-4 shadow-lg flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <h3 class="text-xs font-semibold text-slate-200 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Select Visual Design Direction
          </h3>
          <button onclick="regenerateWireframes()" id="regenUiBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-lg transition font-medium flex items-center gap-1.5">
            <span>↻ Re-roll Wireframes</span>
          </button>
        </div>
        <div id="uiOptionsContainer" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
      </div>

      <!-- Terminal / Logs Output -->
      <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-4 shadow-lg flex flex-col gap-2">
        <div class="flex items-center justify-between text-xs text-slate-400 font-mono">
          <span class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Assembly Line Log</span>
          <span id="currentStepText" class="text-emerald-400">Idle</span>
        </div>
        <div id="logsConsole" class="h-36 bg-slate-950 border border-slate-800 rounded-lg p-3 font-mono text-[11px] text-slate-300 overflow-y-auto space-y-1">
          <div class="text-slate-600">> System initialized. Ready to build.</div>
        </div>
      </div>
    </div>

    <!-- Right Column: Interactive Sandbox & Iteration Console -->
    <div class="lg:col-span-6 flex flex-col gap-4">

      <!-- Iteration & Continuation Console -->
      <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-4 shadow-lg">
        <div class="flex items-center justify-between mb-2">
          <label class="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            Iterate & Continue Building App
          </label>
          <span class="text-[11px] text-slate-500 font-mono">Preserves existing code & adds features</span>
        </div>
        <textarea id="tweakPrompt" rows="3" class="w-full bg-slate-950 border border-slate-700/80 rounded-lg p-3 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 font-sans transition" placeholder="e.g. Add an export-to-CSV button, add a Telegram alerts webhook modal, and include 10 more live tennis fixtures..."></textarea>
        <div class="flex items-center justify-between mt-3">
          <div class="text-[11px] text-slate-500 font-mono">
            ⚡ Lead Coder & Reviewer update the preview.
          </div>
          <button onclick="applyTweak()" id="tweakBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-xs px-4 py-2 rounded-lg transition flex items-center gap-1.5 shadow">
            <span>Execute Build Prompt 🚀</span>
          </button>
        </div>
      </div>

      <!-- Live Sandbox Frame Area -->
      <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-4 shadow-lg flex-1 flex flex-col gap-3 min-h-[550px]">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
            <span class="text-xs font-semibold text-slate-200">Interactive Live Sandbox</span>
          </div>
          <div class="flex items-center gap-2">
            <a href="/api/preview" target="_blank" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 shadow-sm">
              <span>Open in New Tab ↗</span>
            </a>
            <button onclick="reloadPreview()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-1.5 rounded-lg transition">
              ↻ Reload Frame
            </button>
          </div>
        </div>

        <div class="flex-1 w-full bg-slate-950 border border-slate-800 rounded-lg overflow-hidden relative shadow-inner">
          <iframe id="previewFrame" src="/api/preview" class="w-full h-full border-0 absolute inset-0 bg-white"></iframe>
        </div>
      </div>

    </div>
  </main>

  <script>
    let pollInterval = null;

    function switchTab(tab) {
      const customView = document.getElementById("view-custom");
      const marketView = document.getElementById("view-market");
      const tabCustom = document.getElementById("tab-custom");
      const tabMarket = document.getElementById("tab-market");

      if (tab === "custom") {
        customView.classList.remove("hidden");
        marketView.classList.add("hidden");
        tabCustom.className = "px-4 py-2 text-xs font-semibold border-b-2 border-emerald-500 text-emerald-400 transition flex items-center gap-2";
        tabMarket.className = "px-4 py-2 text-xs font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition flex items-center gap-2";
      } else {
        customView.classList.add("hidden");
        marketView.classList.remove("hidden");
        tabMarket.className = "px-4 py-2 text-xs font-semibold border-b-2 border-emerald-500 text-emerald-400 transition flex items-center gap-2";
        tabCustom.className = "px-4 py-2 text-xs font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition flex items-center gap-2";
      }
    }

    async function submitCustomBuild() {
      const title = document.getElementById("customTitle").value.trim();
      const prompt = document.getElementById("customPrompt").value.trim();
      if (!prompt) {
        alert("Please enter project instructions or a blueprint.");
        return;
      }

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerHTML = '<span class="inline-block animate-spin">↻</span> Operations Manager Slicing Architecture...';

      const formData = new FormData();
      formData.append("customPrompt", (title ? `[Project: ${title}]\n\n` : "") + prompt);

      try {
        const res = await fetch("/api/custom-build", { method: "POST", body: formData });
        const data = await res.json();
        if (data.status === "processing") {
          startPolling();
        }
      } catch (err) {
        console.error("Custom build submission failed:", err);
      }
    }

    async function scanMarket() {
      const btn = document.getElementById("scanBtn");
      const focus = document.getElementById("scanFocusInput").value.trim();
      btn.disabled = true;
      btn.innerText = "Scanning...";

      try {
        const res = await fetch(`/api/ideas?focus=${encodeURIComponent(focus)}`);
        const data = await res.json();
        const list = document.getElementById("ideasList");
        list.innerHTML = "";

        (data.ideas || []).forEach(idea => {
          const card = document.createElement("div");
          card.className = "bg-slate-900/90 border border-slate-800 rounded-lg p-3 hover:border-slate-700 transition cursor-pointer";
          card.onclick = () => {
            document.getElementById("customTitle").value = idea.name;
            document.getElementById("customPrompt").value = `Problem: ${idea.problem}\nSolution: ${idea.solution}\nRevenue Model: ${idea.potentialRevenue}`;
            switchTab("custom");
          };
          card.innerHTML = `
            <div class="flex justify-between items-center mb-1">
              <span class="text-xs font-bold text-white">${idea.name}</span>
              <span class="text-[10px] text-emerald-400 font-mono">${idea.potentialRevenue}</span>
            </div>
            <p class="text-[11px] text-slate-400 mb-1">${idea.problem}</p>
            <p class="text-[11px] text-slate-300 font-medium">${idea.solution}</p>
          `;
          list.appendChild(card);
        });
      } catch (err) {
        console.error("Market scan error:", err);
      } finally {
        btn.disabled = false;
        btn.innerText = "Scan Market";
      }
    }

    async function regenerateWireframes() {
      const btn = document.getElementById("regenUiBtn");
      btn.disabled = true;
      btn.innerHTML = '<span class="inline-block animate-spin">↻</span> Generating...';

      try {
        const res = await fetch("/api/regenerate-ui", { method: "POST" });
        const data = await res.json();
        if (data.uiOptions) {
          renderUiCards(data.uiOptions);
        }
      } catch (err) {
        console.error("Failed to regenerate wireframes:", err);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>↻ Re-roll Wireframes</span>';
      }
    }

    function renderUiCards(options) {
      const container = document.getElementById("uiOptionsContainer");
      const picker = document.getElementById("uiPickerCard");
      picker.classList.remove("hidden");
      container.innerHTML = "";

      options.forEach(opt => {
        const card = document.createElement("div");
        card.className = "border border-slate-800 bg-slate-950/70 rounded-lg p-3 flex flex-col justify-between hover:border-emerald-500/60 transition gap-3";
        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-xs font-bold text-white">${opt.name}</span>
              <div class="flex gap-1">
                <span class="w-3 h-3 rounded-full border border-white/20" style="background:${opt.colorPalette?.primary || '#10b981'}"></span>
                <span class="w-3 h-3 rounded-full border border-white/20" style="background:${opt.colorPalette?.accent || '#34d399'}"></span>
              </div>
            </div>
            <p class="text-[11px] text-slate-400 line-clamp-2">${opt.description || ''}</p>
          </div>
          <button onclick='confirmBuild(${JSON.stringify(opt)})' class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-xs py-1.5 rounded transition">
            Build with this UI
          </button>
        `;
        container.appendChild(card);
      });
    }

    async function confirmBuild(chosenUI) {
      const picker = document.getElementById("uiPickerCard");
      picker.classList.add("hidden");

      try {
        await fetch("/api/confirm-build", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chosenUI })
        });
        startPolling();
      } catch (err) {
        console.error("Confirm build error:", err);
      }
    }

    async function applyTweak() {
      const promptEl = document.getElementById("tweakPrompt");
      const instruction = promptEl ? promptEl.value.trim() : "";
      if (!instruction) return;

      const btn = document.getElementById("tweakBtn");
      btn.disabled = true;
      btn.innerHTML = '<span class="inline-block animate-spin">↻</span> Building Updates...';

      try {
        const res = await fetch("/api/tweak", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ instruction })
        });
        const data = await res.json();
        if (data.status === "success") {
          reloadPreview();
          promptEl.value = "";
        } else {
          alert("Build iteration error: " + (data.error || "Unknown error"));
        }
      } catch (err) {
        console.error("Failed to iterate:", err);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Execute Build Prompt 🚀</span>';
      }
    }

    async function resetPipeline() {
      try {
        await fetch("/api/reset", { method: "POST" });
        location.reload();
      } catch (err) {
        console.error("Reset error:", err);
      }
    }

    function reloadPreview() {
      const frame = document.getElementById("previewFrame");
      if (frame) {
        frame.src = "/api/preview?t=" + Date.now();
      }
    }

    function startPolling() {
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(async () => {
        try {
          const res = await fetch("/api/status");
          const data = await res.json();

          document.getElementById("currentStepText").innerText = data.currentStep || data.status;

          const consoleDiv = document.getElementById("logsConsole");
          if (data.logs && data.logs.length > 0) {
            consoleDiv.innerHTML = data.logs.map(l => `<div>> ${l}</div>`).join("");
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
          }

          if (data.uiOptions && data.uiOptions.length > 0 && data.status === "awaiting_ui_choice") {
            renderUiCards(data.uiOptions);
            const submitBtn = document.getElementById("submitBtn");
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Render 3 UI Wireframes';
            }
          }

          if (data.status === "done") {
            clearInterval(pollInterval);
            reloadPreview();
            const submitBtn = document.getElementById("submitBtn");
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Render 3 UI Wireframes';
            }
          }
        } catch (err) {
          console.error("Polling error:", err);
        }
      }, 1500);
    }
  </script>
</body>
</html>
